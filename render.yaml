services:
  - type: web
    name: oficina-automacao
    runtime: node
    plan: free
    region: oregon
    rootDir: oficina
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
